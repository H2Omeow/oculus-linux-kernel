name: Stock 5.10.240 rebuild with VA48, NTSync, KSU and Droidspaces

# Builds the *device's own kernel version* (5.10.240, uname identical to the
# stock kernel) with the handoff patches and the requested feature set, so the
# result is both uname-compatible and KMI-compatible with the stock vendor
# modules:
#
#   Linux localhost 5.10.240-g9cb2f620a9a8 #1 SMP PREEMPT
#   Thu Jul 2 23:18:32 PDT 2026 aarch64 Toybox
#
# Source is the public stock snapshot (729ec6c4).  The fork's feature commits
# are applied as a patch on top of it; the fork's own defconfig is NOT used,
# the configuration is derived from the device's /proc/config.gz.

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Also build modules (slower)'
        type: boolean
        default: true
      ksu_mode:
        description: 'KernelSU build form: builtin or lkm'
        type: choice
        options:
          - builtin
          - lkm
        default: builtin
  push:
    paths:
      - '.github/workflows/stock-va48-build.yml'
      - 'tools/quest3s/stock-240.fragment'

permissions:
  contents: read

env:
  STOCK_URL: https://github.com/facebookincubator/oculus-linux-kernel
  STOCK_SHA: 729ec6c4b2086454e0157cbc810f5a460789cc67
  FORK_URL: https://github.com/H2Omeow/oculus-linux-kernel
  FORK_REF: handoff/ci  # va48-quest3s + the handoff driver and tooling
  FORK_BASE: 043e6bcc61899eaa759a3f1b76606a190c8bb918
  CLANG_REV: clang-r450784e
  CLANG_REF: android14-release
  DEVICE_CONFIG: tools/quest3s/device-5.10.240-g9cb2f620a9a8.config
  FEATURE_FRAGMENT: tools/quest3s/handoff-target.fragment
  IDENTITY_FRAGMENT: tools/quest3s/stock-240.fragment
  UTS_TIMESTAMP: 'Thu Jul 2 23:18:32 PDT 2026'
  UTS_RELEASE: '5.10.240-g9cb2f620a9a8'
  KSU_MODE: ${{ inputs.ksu_mode || 'builtin' }}
  # The manager APK compares its own versionCode with the kernel's KSU_VERSION
  # over the supercall and refuses to drive a kernel that reports a different
  # one, so the kernel has to carry the code of the APK people can actually
  # install.  The newest publicly built manager is BakaSU v4.2.0-rc3 / 35254
  # (CI artifact "Manager-release"); the vendored tree says 35252.
  KSU_VERSION_CODE: '35254'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Host packages and swap
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio \
            rsync gzip xz-utils python3 python3-pyelftools pkg-config \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler
          # Full LTO of a 5.10 kernel does not fit 7 GiB; give the linker room.
          # The runner image already owns /swapfile, so use a fresh path.
          sudo rm -f /swapfile-lto
          sudo fallocate -l 8G /swapfile-lto
          sudo chmod 600 /swapfile-lto
          sudo mkswap /swapfile-lto >/dev/null
          sudo swapon /swapfile-lto
          free -m

      - name: Cache Android clang
        id: clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: ${{ env.CLANG_REV }}-v1

      - name: Fetch Android clang
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clang && cd ~/clang
          curl -fsSL --retry 3 -o clang.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$CLANG_REF/$CLANG_REV.tar.gz"
          tar -xzf clang.tgz && rm clang.tgz
          ./bin/clang --version | head -1

      - name: Fetch the stock tree at the device commit
        run: |
          mkdir -p "$RUNNER_TEMP/stock"
          cd "$RUNNER_TEMP/stock"
          git init -q .
          git remote add origin "$STOCK_URL"
          git fetch -q --depth 1 origin "$STOCK_SHA"
          git checkout -q FETCH_HEAD
          echo "stock $(git rev-parse HEAD)"

      - name: Extract the fork feature patch
        run: |
          git clone -q --no-checkout --filter=blob:none --depth 8 \
            --branch "$FORK_REF" "$FORK_URL" "$RUNNER_TEMP/fork"
          cd "$RUNNER_TEMP/fork"
          git diff "$FORK_BASE" "$FORK_REF" > "$RUNNER_TEMP/features.patch"
          wc -l "$RUNNER_TEMP/features.patch"
          grep -c '^diff --git' "$RUNNER_TEMP/features.patch"

      - name: Apply the feature patch to the stock tree
        run: |
          cd "$RUNNER_TEMP/stock"
          set +e
          git apply --3way --whitespace=nowarn "$RUNNER_TEMP/features.patch"
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::warning::git apply --3way exited $rc; checking what landed"
          fi
          if grep -rIl '^<<<<<<< ' --include='*.c' --include='*.h' --include='*.S' . \
               --exclude-dir=.git | head -20 | tee "$RUNNER_TEMP/conflicts.txt" | grep -q .; then
            echo "::error::conflict markers left in the tree"
            cat "$RUNNER_TEMP/conflicts.txt"
            exit 1
          fi
          echo "== VA48 and feature markers =="
          # Assert on *content*, not on `git diff`: `git apply --3way` stages
          # what it applied, so `git diff` alone would look empty even on a
          # successful application.
          fail=0
          check() { # pattern file description
            if grep -q "$1" "$2" 2>/dev/null; then
              echo "ok   $3"
            else
              echo "::error::missing $3 (pattern '$1' in $2)"
              fail=1
            fi
          }
          check 'define KERNEL_VA_BITS' arch/arm64/include/asm/memory.h \
            'userspace VA48 / kernel VA39 split'
          check 'KERNEL_VA_BITS - 1' arch/arm64/mm/init.c \
            'linear map sized by kernel VA bits'
          check 'KERNEL_VA_BITS - 2' arch/arm64/kernel/kaslr.c \
            'KASLR range clamped to the kernel VA window'
          check 'config QUEST_HANDOFF' drivers/misc/Kconfig 'quest_handoff driver'
          check 'QCOM_KGSL_GPU_VA48' drivers/gpu/msm/Kconfig 'KGSL GPU VA48 support'
          check 'KSU_TRACEPOINT_HOOK' drivers/kernelsu/Kconfig 'KernelSU tracepoint hook'
          check 'config NTSYNC' drivers/misc/Kconfig 'NTSync driver'
          [ -f drivers/misc/quest_handoff.c ] || { echo "::error::quest_handoff.c missing"; fail=1; }
          [ -f drivers/misc/ntsync.c ] || { echo "::error::ntsync.c missing"; fail=1; }
          git status --short | head -20
          exit $fail

      - name: Configure from the device configuration
        run: |
          cd "$RUNNER_TEMP/stock"
          export PATH="$HOME/clang/bin:$PATH"
          # Pin the version code the manager compares against (see KSU_VERSION_CODE).
          if [ -n "${KSU_VERSION_CODE:-}" ]; then
            sed -i -E \
              "s/^KSU_VERSION[[:space:]]*:=[[:space:]]*[0-9]+/KSU_VERSION := $KSU_VERSION_CODE/" \
              drivers/kernelsu/Kbuild
            echo "== KernelSU version code =="
            grep -nE '^KSU_VERSION[[:space:]]*:=' drivers/kernelsu/Kbuild || {
              echo "::error::no KSU_VERSION assignment in drivers/kernelsu/Kbuild"; exit 1; }
            grep -qE "^KSU_VERSION[[:space:]]*:=[[:space:]]*$KSU_VERSION_CODE$" drivers/kernelsu/Kbuild \
              || { echo "::error::failed to pin KSU_VERSION to $KSU_VERSION_CODE"; exit 1; }
          fi
          mkdir -p out
          cp "$GITHUB_WORKSPACE/$DEVICE_CONFIG" out/.config
          # KernelSU (BakaSU lineage) can be built into the kernel or as an LKM.
          # The device currently gets root from an insmod'ed kernelsu.ko, so the
          # LKM form is what a drop-in replacement should be; "builtin" is the
          # fork's own default.
          case "$KSU_MODE" in
            lkm)     ksu_val=m ;;
            builtin) ksu_val=y ;;
            *) echo "::error::unknown ksu_mode '$KSU_MODE' (builtin|lkm)"; exit 1 ;;
          esac
          echo "== KernelSU build form: CONFIG_KSU=$ksu_val =="
          printf 'CONFIG_KSU=%s\n' "$ksu_val" > "$RUNNER_TEMP/ksu.fragment"
          ./scripts/kconfig/merge_config.sh -m -O out out/.config \
            "$GITHUB_WORKSPACE/$FEATURE_FRAGMENT" \
            "$GITHUB_WORKSPACE/$IDENTITY_FRAGMENT" \
            "$RUNNER_TEMP/ksu.fragment"
          make -s ARCH=arm64 LLVM=1 LLVM_IAS=1 REAL_CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION= O=out olddefconfig
          echo "== identity =="
          grep -E '^CONFIG_LOCALVERSION' out/.config
          grep -E 'LOCALVERSION_AUTO' out/.config || echo "MISSING LOCALVERSION_AUTO"
          echo "== requested features =="
          for s in ARM64_VA_BITS_48 NTSYNC KSU_TRACEPOINT_HOOK \
                   QCOM_KGSL_GPU_VA48 QUEST_HANDOFF USER_NS OVERLAY_FS TUN VETH \
                   BRIDGE CHECKPOINT_RESTORE CFI_CLANG LTO_CLANG_FULL PREEMPT; do
            grep -q "^CONFIG_$s=y" out/.config && echo "ok   CONFIG_$s" \
              || echo "MISSING CONFIG_$s=y"
          done
          grep -E '^CONFIG_KSU=' out/.config
          grep -q "^CONFIG_KSU=$ksu_val" out/.config \
            || { echo "::error::CONFIG_KSU is not $ksu_val after configure"; exit 1; }
          grep -E '^CONFIG_PGTABLE_LEVELS=' out/.config
          grep -E '^CONFIG_ARM64_VA_BITS=' out/.config

      - name: Build Image and modules
        run: |
          cd "$RUNNER_TEMP/stock"
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_TIMESTAMP="$UTS_TIMESTAMP"
          targets="Image"
          if [ "${{ inputs.modules }}" != 'false' ]; then
            targets="Image modules"
          fi
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 REAL_CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION= O=out \
            -j"$(nproc)" $targets 2>&1 | tail -n 600 > build-tail.log || {
              tail -n 200 build-tail.log; exit 1; }
          tail -n 20 build-tail.log
          echo "== generated identity =="
          grep UTS_RELEASE out/include/generated/utsrelease.h
          grep UTS_VERSION out/include/generated/compile.h
          cat out/include/config/kernel.release

      - name: Verify the uname string in the Image
        run: |
          cd "$RUNNER_TEMP/stock"
          # uname -r and uname -v are compiled in separately: utsname.release is
          # UTS_RELEASE and utsname.version is UTS_VERSION, and linux_banner
          # puts the compile-by/host/compiler fields between them, so they can
          # never appear as one contiguous string.  Check them separately.
          echo "want release: $UTS_RELEASE"
          echo "want version: #1 SMP PREEMPT $UTS_TIMESTAMP"
          strings out/arch/arm64/boot/Image | grep -F "$UTS_RELEASE" | head -5
          strings out/arch/arm64/boot/Image | grep -F "#1 SMP PREEMPT $UTS_TIMESTAMP" | head -5
          rc=0
          strings out/arch/arm64/boot/Image | grep -qF "Linux version $UTS_RELEASE" \
            || { echo "::error::Image does not carry utsname.release $UTS_RELEASE"; rc=1; }
          strings out/arch/arm64/boot/Image | grep -qF "#1 SMP PREEMPT $UTS_TIMESTAMP" \
            || { echo "::error::Image does not carry utsname.version '#1 SMP PREEMPT $UTS_TIMESTAMP'"; rc=1; }
          grep -qF "\"$UTS_RELEASE\"" out/include/generated/utsrelease.h \
            || { echo "::error::generated utsrelease.h is not $UTS_RELEASE"; rc=1; }
          grep -qF "#1 SMP PREEMPT $UTS_TIMESTAMP" out/include/generated/compile.h \
            || { echo "::error::generated compile.h does not carry the device UTS_VERSION"; rc=1; }
          exit $rc

      - name: Export Image.el1 and collect artifacts
        run: |
          cd "$RUNNER_TEMP/stock"
          export PATH="$HOME/clang/bin:$PATH"
          curl -fsSL -o prepare-image.py \
            "https://raw.githubusercontent.com/H2Omeow/quest3s-el1-kexec/main/scripts/prepare-image.py"
          python3 prepare-image.py out/vmlinux Image.el1
          mkdir -p dist
          {
            echo "build: stock $STOCK_SHA + $FORK_REF feature patch"
            echo "compiler: $(clang --version | head -1)"
            echo "uts_release: $(grep -o '"[^"]*"' out/include/generated/utsrelease.h | tr -d '\"')"
            echo "uts_version: $(sed -n 's/^#define UTS_VERSION \"\\(.*\\)\"/\\1/p' out/include/generated/compile.h)"
            echo "config_localversion: $(sed -n 's/^CONFIG_LOCALVERSION=\"\\(.*\\)\"/\\1/p' out/.config)"
            echo "va_bits: $(sed -n 's/^CONFIG_ARM64_VA_BITS=\\(.*\\)/\\1/p' out/.config)"
            echo "pgtables: $(sed -n 's/^CONFIG_PGTABLE_LEVELS=\\(.*\\)/\\1/p' out/.config)"
            echo "ksu: $(grep -E '^CONFIG_KSU=' out/.config) tracepoint=$(grep -cE '^CONFIG_KSU_TRACEPOINT_HOOK=y' out/.config) multi_manager=$(grep -cE '^CONFIG_KSU_MULTI_MANAGER_SUPPORT=y' out/.config)"
            echo "ksu_version_code: $(grep -E '^KSU_VERSION[[:space:]]*:=' drivers/kernelsu/Kbuild | head -1 | sed -E 's/.*:[[:space:]]*//') (pinned to KSU_VERSION_CODE=$KSU_VERSION_CODE)"
            echo "ntsync: $(grep -E '^CONFIG_NTSYNC=' out/.config)"
            echo "kgsl: $(grep -E '^CONFIG_QCOM_KGSL(_GPU_VA48)?=' out/.config | tr '\n' ' ')"
            echo "image_bytes: $(stat -c%s out/arch/arm64/boot/Image)"
            echo "image_el1_bytes: $(stat -c%s Image.el1)"
          } > dist/identity.txt
          cat dist/identity.txt
          cp out/arch/arm64/boot/Image dist/
          cp Image.el1 dist/
          cp out/Module.symvers dist/
          cp out/System.map dist/
          cp out/.config dist/config-used
          cp out/include/config/kernel.release dist/
          if [ -d out ]; then
            find out -name '*.ko' -printf '%P\n' | sort > dist/modules.list || true
            (cd out && find . -name '*.ko' -print0 | tar -czf "$GITHUB_WORKSPACE/dist-modules.tgz" --null -T -) || true
          fi
          (cd dist && sha256sum Image Image.el1 Module.symvers 2>/dev/null | tee SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: stock-240-va48-kernel
          path: |
            ${{ runner.temp }}/stock/dist/*
            dist-modules.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-240-va48-logs
          path: |
            ${{ runner.temp }}/stock/build-tail.log
